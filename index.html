<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Anjali ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

h1 {
    color: white;
    font-size: 3em;
}

#message {
    color: white;
    font-size: 1.5em;
    margin: 15px;
}

#reaction img {
    width: 220px;
    border-radius: 15px;
    margin-top: 10px;
}

.buttons {
    position: relative;
    margin-top: 20px;
}

button {
    font-size: 1.5em;
    padding: 15px 40px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

#yesBtn {
    background: #ff3366;
    color: white;
}

#noBtn {
    background: #444;
    color: white;
    position: absolute;
    left: 180px;
}
</style>
</head>

<body>

<h1>Anjali Karki ❤️</h1>
<p id="message">Will you be my Valentine? 💘</p>
<div id="reaction"></div>

<div class="buttons">
    <button id="yesBtn" onclick="yesClicked()">YES 💖</button>
    <button id="noBtn" onclick="noClicked()" onmouseover="moveNo()">NO 💔</button>
</div>

<script>
let noCount = 0;
let yesSize = 1;

function noClicked() {
    noCount++;

    if (noCount === 1) {
        document.getElementById("message").innerHTML = "😒 Wrong answer";
    } 
    else if (noCount === 2) {
        document.getElementById("message").innerHTML = "🥺 Please be my Valentine";
        document.getElementById("reaction").innerHTML =
        `<img src="https://media.giphy.com/media/3o6ZsS8GFJKJeJoRQ4/giphy.gif">`;
    }
    else if (noCount === 3) {
        document.getElementById("message").innerHTML =
        "🧪 Okay… taking drastic measures 😏 Love potion activated!";
        document.getElementById("reaction").innerHTML =
        `<img src="https://i.imgur.com/5qH6YtH.png">`;
    }
}

function moveNo() {
    if (noCount >= 2) {
        const noBtn = document.getElementById("noBtn");
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        yesSize += 0.15;
        document.getElementById("yesBtn").style.transform = `scale(${yesSize})`;
    }
}

function yesClicked() {
    window.location.href = "love.html";
}
</script>

</body>
</html>
