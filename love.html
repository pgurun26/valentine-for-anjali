<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anjali ❤️ My Valentine</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #ff9a9e, #fad0c4);
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    color: white;
    padding: 30px;
    overflow: hidden;
}

h1 {
    font-size: 3.5em;
}

p {
    font-size: 1.6em;
}

iframe {
    margin-top: 20px;
    border-radius: 20px;
}

/* Heart rain */
.heart {
    position: absolute;
    animation: fall 5s linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); opacity: 1; }
    100% { transform: translateY(110vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>Anjali Karki ❤️</h1>
<p>
You said YES 💖<br>
And that just made me the luckiest person alive 😘<br>
This song reminds me of you ✨
</p>

<!-- Ed Sheeran – Perfect -->
<iframe width="320" height="180"
src="https://www.youtube.com/embed/2Vv-BfVoq4g?autoplay=1&mute=1"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

<p style="margin-top:20px;">
💖💖💖💖💖<br>
❤️❤️❤️❤️❤️<br>
💕💕💕💕💕
</p>

<script>
/* Heart rain */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 25) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 250);
</script>

</body>
</html>
